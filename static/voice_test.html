<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Daraz Voice -- manual test</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --primary: #f85c2c;
      /* Daraz Orange */
      --primary-hover: #e0481a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-light: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 860px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    h1::before {
      content: "🎙️";
      font-size: 1.8rem;
    }

    p {
      color: var(--text-light);
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    /* Form Controls */
    label[for="mode"] {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      margin-right: 0.75rem !important;
    }

    select#mode {
      appearance: none !important;
      -webkit-appearance: none !important;
      background-color: var(--card-bg) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      padding: 0.65rem 2.5rem 0.65rem 1rem !important;
      margin-right: 1.5rem !important;
      font-size: 0.95rem !important;
      font-weight: 500 !important;
      color: var(--text) !important;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E") !important;
      background-repeat: no-repeat !important;
      background-position: right 0.8rem center !important;
      background-size: 16px !important;
      cursor: pointer !important;
      transition: all 0.2s !important;
    }

    select#mode:hover,
    select#mode:focus {
      border-color: var(--primary) !important;
      outline: none !important;
      box-shadow: 0 0 0 3px rgba(248, 92, 44, 0.15) !important;
    }

    button {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.65rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    #start {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(248, 92, 44, 0.2);
    }

    #start:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 8px -1px rgba(248, 92, 44, 0.3);
    }

    #start::before {
      content: "▶";
      font-size: 0.8rem;
    }

    #stop {
      background-color: #ef4444;
      color: white;
      box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2);
    }

    #stop:hover:not(:disabled) {
      background-color: #dc2626;
      transform: translateY(-1px);
    }

    #stop::before {
      content: "⏹";
      font-size: 0.8rem;
    }

    button:disabled {
      background-color: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* Transcript and Reply */
    #transcript {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      min-height: 2.5rem;
      padding: 1.25rem;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    #reply {
      font-size: 1.05rem;
      color: var(--text-light);
      line-height: 1.7;
      margin-bottom: 1.5rem;
      padding: 0 0.5rem;
    }

    /* Products Grid */
    #products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      font-size: 0.9rem;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      border-radius: 8px;
      background: #f1f5f9;
      margin-bottom: 0.75rem;
      padding: 0.75rem;
    }

    .card a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 0.75rem;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card a:hover {
      color: var(--primary);
    }

    .card .price {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--primary);
      margin-top: auto;
    }

    /* Log Output */
    #log {
      margin-top: 2.5rem;
      background: #0f172a;
      color: #cbd5e1;
      padding: 1.25rem;
      white-space: pre-wrap;
      font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      border-radius: var(--radius);
      max-height: 24rem;
      overflow: auto;
      border: 1px solid #1e293b;
      box-shadow: var(--shadow);
    }

    #log::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    #log::-webkit-scrollbar-track {
      background: #1e293b;
      border-radius: 4px;
    }

    #log::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }

    #log::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
  </style>
</head>

<body>
  <h1>Daraz Voice -- manual test</h1>
  <p>Speak into the microphone. The assistant will transcribe, search, and speak the reply.</p>

  <label for="mode" style="margin-right: 0.5rem;">Mode:</label>
  <select id="mode" style="padding: 0.4rem; margin-right: 1rem;">
    <option value="sandwich">Sandwich (Deepgram + ElevenLabs)</option>
    <option value="live">Live (Gemini audio-to-audio)</option>
  </select>

  <button id="start">Start session</button>
  <button id="stop" disabled>Stop</button>

  <div id="transcript">(transcript appear here)</div>
  <div id="reply"></div>
  <div id="products"></div>
  <div id="log"></div>

  <script>
    // ----------------------------------------------------------------------
    // Config -- must match the server's config for sample rates.
    //
    // Both modes use the same rates:
    //   browser -> server : PCM16 mono, 16 kHz
    //   server -> browser : PCM16 mono, 24 kHz
    // Gemini Live and ElevenLabs both return 24 kHz PCM16.
    // ----------------------------------------------------------------------
    const STT_SAMPLE_RATE = 16000;   // browser -> server (PCM16 mono)
    const TTS_SAMPLE_RATE = 24000;   // server -> browser (PCM16 mono)
    const backendPort = new URLSearchParams(location.search).get('backendPort') || '8000';

    // ----------------------------------------------------------------------
    // State
    // ----------------------------------------------------------------------
    let ws = null;
    let micCtx = null;
    let outCtx = null;
    let micStream = null;
    let sourceNode = null;
    let workletNode = null;
    let nextPlayTime = 0;
    let playbackSources = [];

    // ----------------------------------------------------------------------
    // AudioWorklet -- does the float32 -> int16 conversion inline.
    // ----------------------------------------------------------------------
    const WORKLET_CODE = `
class PCM16Sender extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0]?.[0];
    if (!ch) return true;
    const i16 = new Int16Array(ch.length);
    for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      i16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    this.port.postMessage(i16.buffer, [i16.buffer]);
    return true;
  }
}
registerProcessor('pcm16-sender', PCM16Sender);
`;

    // ----------------------------------------------------------------------
    // UI helpers
    // ----------------------------------------------------------------------
    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += msg + '\n';
      el.scrollTop = el.scrollHeight;
    }

    function renderProducts(products) {
      const el = document.getElementById('products');
      el.innerHTML = '';
      for (const p of products || []) {
        const card = document.createElement('div');
        card.className = 'card';
        const title = p.title || '';
        const url = p.url || '#';
        const price = p.price != null ? `Rs. ${p.price.toLocaleString()}` : '';
        card.innerHTML = `
      ${p.image ? `<img src="${p.image}" alt="">` : ''}
      <a href="${url}" target="_blank" rel="noopener">${title.slice(0, 80)}</a>
      <div class="price">${price}</div>
    `;
        el.appendChild(card);
      }
    }

    // ----------------------------------------------------------------------
    // Audio playback queue
    // ----------------------------------------------------------------------
    function queueAudio(int16Bytes) {
      if (!outCtx) return;
      const samples = new Int16Array(int16Bytes);
      const floats = new Float32Array(samples.length);
      for (let i = 0; i < samples.length; i++) floats[i] = samples[i] / 0x8000;

      const buf = outCtx.createBuffer(1, floats.length, TTS_SAMPLE_RATE);
      buf.copyToChannel(floats, 0);
      const src = outCtx.createBufferSource();
      src.buffer = buf;
      src.connect(outCtx.destination);

      const start = Math.max(outCtx.currentTime, nextPlayTime);
      src.start(start);
      nextPlayTime = start + buf.duration;
      playbackSources.push(src);
      src.onended = () => {
        playbackSources = playbackSources.filter((s) => s !== src);
      };
    }

    function stopPlayback() {
      for (const s of playbackSources) {
        try { s.stop(); } catch (_) { }
      }
      playbackSources = [];
      nextPlayTime = outCtx ? outCtx.currentTime : 0;
    }

    // ----------------------------------------------------------------------
    // Session
    // ----------------------------------------------------------------------
    async function startSession() {
      document.getElementById('start').disabled = true;
      document.getElementById('stop').disabled = false;

      const mode = document.getElementById('mode').value;
      const path = mode === 'live'
        ? '/api/v1/voice/live/ws'
        : '/api/v1/voice/ws';
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const hostname = location.hostname || '127.0.0.1';
      const url = `${protocol}//${hostname}:${backendPort}${path}`;
      log(`[ws] connecting mode=${mode} url=${url}`);

      ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        log('[ws] open');
        await startMic();
      };

      ws.onmessage = (e) => {
        if (typeof e.data === 'string') {
          handleJson(JSON.parse(e.data));
        } else {
          queueAudio(e.data);
        }
      };

      ws.onclose = () => {
        log('[ws] closed');
        stopSession();
      };

      ws.onerror = (e) => log(`[ws] error: ${e.message || 'unknown'}`);
    }

    function handleJson(msg) {
      // Heartbeat ping -- invisible to the log.
      if (msg.type === 'ping') return;
      log(`[json] ${JSON.stringify(msg).slice(0, 200)}`);
      if (msg.type === 'transcript_interim') {
        document.getElementById('transcript').textContent = msg.text + ' ...';
      } else if (msg.type === 'transcript_final') {
        document.getElementById('transcript').textContent = msg.text;
      } else if (msg.type === 'reply_chunk') {
        document.getElementById('reply').textContent += msg.text;
      } else if (msg.type === 'intent') {
        document.getElementById('reply').textContent = '';
      } else if (msg.type === 'done') {
        renderProducts(msg.recommended_products || []);
      } else if (msg.type === 'stop_playback') {
        stopPlayback();
      } else if (msg.type === 'error') {
        log(`[error] ${msg.message}`);
      }
    }

    async function startMic() {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
      });
      micCtx = new AudioContext({ sampleRate: STT_SAMPLE_RATE });
      await micCtx.audioWorklet.addModule(URL.createObjectURL(
        new Blob([WORKLET_CODE], { type: 'application/javascript' })
      ));
      sourceNode = micCtx.createMediaStreamSource(micStream);
      workletNode = new AudioWorkletNode(micCtx, 'pcm16-sender');
      workletNode.port.onmessage = (e) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(e.data);
        }
      };
      sourceNode.connect(workletNode);
      // Do NOT connect worklet to destination -- we don't want mic feedback.

      outCtx = new AudioContext({ sampleRate: TTS_SAMPLE_RATE });
      nextPlayTime = outCtx.currentTime;
      log('[mic] streaming');
    }

    function stopSession() {
      document.getElementById('start').disabled = false;
      document.getElementById('stop').disabled = true;

      if (ws) { try { ws.close(); } catch (_) { } ws = null; }
      if (workletNode) { try { workletNode.disconnect(); } catch (_) { } workletNode = null; }
      if (sourceNode) { try { sourceNode.disconnect(); } catch (_) { } sourceNode = null; }
      if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
      if (micCtx) { try { micCtx.close(); } catch (_) { } micCtx = null; }
      if (outCtx) { try { outCtx.close(); } catch (_) { } outCtx = null; }
      stopPlayback();
      log('[mic] stopped');
    }

    document.getElementById('start').onclick = () => startSession().catch((e) => log('[error] ' + e.message));
    document.getElementById('stop').onclick = () => stopSession();
  </script>
</body>

</html>
